[package]
name = "encfs-agent"
version = "0.1.0"
edition = "2021"
description = "Local read-only companion for EncFS Tree Browser: unrestricted directory listing + serves the embedded app"
license = "GPL-2.0-or-later"

[dependencies]

# Build-time only (gzip of the embedded app) — never linked into the binary.
[build-dependencies]
flate2 = "1"

# Windows-only: embed icon.ico as the exe resource (build-time only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
